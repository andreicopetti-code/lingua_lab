<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, minimal-ui"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#fef6e8"/>
<title>La Cocina Porteña</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22La%20Cocina%20Porteña%22,%22short_name%22:%22Cocina%22,%22start_url%22:%22/%22,%22display%22:%22fullscreen%22,%22orientation%22:%22portrait%22,%22background_color%22:%22%23fef6e8%22,%22theme_color%22:%22%23c96a20%22}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 180 180%22><text x=%2290%22 y=%22120%22 font-size=%22140%22 text-anchor=%22middle%22>👨‍🍳</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#fef6e8;--surface:#fffdf5;--border:#e2c088;--accent:#c96a20;--gold:#a04e00;
  --text:#2d1400;--muted:#9a7050;--dim:#c4a480;--green:#2a6e2a;--red:#b82020;
  --green-lt:#e6f4e6;--red-lt:#fce8e8;--radius:20px;--shadow:0 4px 20px rgba(160,78,0,.13);
}
html{height:100%;height:100vh;height:100dvh;}
body{
  height:100%;height:100vh;height:100dvh;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;position:fixed;top:0;left:0;right:0;width:100%;
  padding:0!important;margin:0!important;
}
html{height:-webkit-fill-available;}
body{min-height:-webkit-fill-available;padding-top:0!important;padding-bottom:env(safe-area-inset-bottom,0px);}
#ans::-webkit-contacts-auto-fill-button,#ans::-webkit-credentials-auto-fill-button,
#ans::-webkit-caps-lock-indicator,input::-webkit-input-speech-button{display:none!important;}
@supports(height:100dvh){#shell{height:100dvh;}}
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(196,106,32,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(196,106,32,.07) 1px,transparent 1px);
  background-size:28px 28px;z-index:0;pointer-events:none;
}
#shell{
  position:relative;z-index:1;display:flex;flex-direction:column;
  height:100%;height:100vh;height:100dvh;
  max-width:480px;margin:0 auto;padding:0 14px 0;width:100%;
}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 0 7px;flex-shrink:0;
  border-bottom:1px solid var(--border);margin-bottom:8px;
}
.logo{display:flex;align-items:center;gap:7px;}
.logo-icon{font-size:20px;}
.logo-name{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.3px;}
.hud{display:flex;align-items:center;gap:10px;}
.lives-bar{display:flex;align-items:center;justify-content:center;gap:4px;padding:4px 0 6px;flex-shrink:0;}
.heart{font-size:20px;transition:transform .2s,opacity .2s;}
.heart.lost{opacity:.2;transform:scale(.8);}
.streak-badge{
  display:flex;align-items:center;gap:3px;
  background:#fff4e0;border:1px solid #f0c070;
  border-radius:99px;padding:3px 9px;
  font-size:12px;font-weight:700;color:#b85c00;transition:all .3s;
}
.streak-badge.hot{background:#ffe8d0;border-color:#e07020;}
.score-badge{background:#fff4e0;border:1px solid #f0c070;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--gold);}
.voice-toggle{background:#fff4e0;border:1px solid #f0c070;border-radius:99px;padding:2px 8px;font-size:13px;cursor:pointer;line-height:1.4;-webkit-appearance:none;}
.speak-btn{background:none;border:none;font-size:18px;cursor:pointer;padding:0 2px;line-height:1;-webkit-appearance:none;}
.speak-btn:active{transform:scale(.85);}
.prog-wrap{height:5px;background:#e8d8c0;border-radius:99px;overflow:hidden;flex-shrink:0;margin-bottom:4px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),#f0a030);border-radius:99px;transition:width .5s ease;}
.prog-retry{height:100%;background:linear-gradient(90deg,#d4a020,#e8c040);border-radius:99px;transition:width .5s ease;}
.prog-wrap-inner{display:flex;height:100%;}
.retry-count{flex-shrink:0;text-align:center;font-size:10px;color:var(--muted);padding-bottom:4px;min-height:14px;}
.word-card{
  flex-shrink:0;background:var(--surface);border:2px solid var(--border);
  border-radius:var(--radius);padding:18px 20px 16px;
  box-shadow:var(--shadow);margin-bottom:10px;
  transition:border-color .25s,box-shadow .25s,transform .1s;
  position:relative;overflow:hidden;
}
.word-card::after{content:'🍽';position:absolute;bottom:8px;right:12px;font-size:28px;opacity:.07;pointer-events:none;user-select:none;}
.word-card.ok{border-color:var(--green);box-shadow:0 0 0 3px rgba(42,110,42,.15),var(--shadow);}
.word-card.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(184,32,32,.15),var(--shadow);}
.word-card.retry-card{border-style:dashed;}
.cat-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
  border-radius:99px;padding:3px 10px;border:1px solid;margin-bottom:10px;
}
.diff-pip{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle;}
.diff-pip span{font-size:10px;}
.prefix-hint{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:800;background:#e8f0ff;color:#2244aa;
  border:1px solid #aabcee;border-radius:99px;padding:3px 9px;margin-left:5px;
  letter-spacing:.5px;font-family:monospace;
}
.retry-pill{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10px;font-weight:700;background:#fff4e0;border:1px solid #f0c070;
  border-radius:99px;padding:2px 8px;color:#a06000;margin-left:6px;
}
.pt-word{font-size:clamp(28px,9vw,46px);font-weight:800;color:var(--text);line-height:1.1;letter-spacing:-.5px;}
.feedback-line{margin-top:10px;min-height:24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.fb-wrong{font-size:15px;color:var(--red);text-decoration:line-through;opacity:.8;}
.fb-arrow{color:var(--dim);font-size:13px;}
.fb-correct-word{font-size:19px;font-weight:800;color:var(--green);}
.fb-ok{font-size:18px;font-weight:800;color:var(--green);}
.fb-also{font-size:11px;color:var(--muted);margin-left:2px;}
/* Exemplo de frase após 2º erro */
.example-line{
  margin-top:8px;padding:8px 10px;
  background:#fff8ed;border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;
  font-size:12px;color:var(--muted);line-height:1.5;
  flex-basis:100%;
}
.example-line em{color:var(--accent);font-style:normal;font-weight:700;}
.input-wrap{flex-shrink:0;display:flex;gap:8px;margin-bottom:5px;}
.ans-div{
  flex:1;min-height:52px;background:#fff;border:2px solid var(--border);
  border-radius:14px;padding:14px 16px;font-size:18px;color:var(--text);
  outline:none;font-family:inherit;transition:border-color .2s,box-shadow .2s;
  caret-color:var(--accent);box-shadow:0 2px 8px rgba(160,78,0,.08);
  cursor:text;line-height:1.2;white-space:nowrap;overflow:hidden;
  -webkit-user-select:text;user-select:text;
}
.ans-div:empty::before{content:attr(data-placeholder);color:var(--dim);font-size:15px;font-weight:400;pointer-events:none;}
.ans-div:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(196,106,32,.15);}
.ans-div.ok{border-color:var(--green);box-shadow:0 0 0 3px rgba(42,110,42,.12);color:var(--green);}
.ans-div.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(184,32,32,.12);color:var(--red);}
.ans-div[contenteditable="false"]{opacity:.7;cursor:default;}
.btn{
  height:52px;padding:0 20px;
  background:linear-gradient(135deg,var(--accent),#9a4800);
  color:#fff;border:none;border-radius:14px;
  font-size:15px;font-weight:800;font-family:inherit;
  cursor:pointer;white-space:nowrap;
  box-shadow:0 4px 14px rgba(196,106,32,.35);
  transition:transform .1s,opacity .2s;-webkit-appearance:none;letter-spacing:.3px;
}
.btn:active{transform:scale(.94);}
.btn:disabled{opacity:.38;cursor:default;}
.hint-text{flex-shrink:0;text-align:center;font-size:11px;color:var(--dim);font-style:italic;min-height:16px;}
.enter-hint{flex-shrink:0;text-align:center;font-size:10px;color:var(--dim);min-height:13px;margin-top:-3px;}
.spacer{flex:1;max-height:20px;}
.counter{flex-shrink:0;text-align:center;font-size:11px;color:var(--muted);padding-top:3px;}
#toast{
  position:fixed;top:-64px;left:50%;transform:translateX(-50%);
  background:#2a6e2a;color:#fff;padding:10px 22px;border-radius:99px;
  font-weight:700;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);
  transition:top .35s cubic-bezier(.34,1.56,.64,1);z-index:999;white-space:nowrap;
}
#toast.show{top:14px;}

/* ── Chef Level badge ── */
.chef-level{
  display:flex;align-items:center;gap:5px;
  background:#fff8ed;border:1.5px solid #f0c070;
  border-radius:12px;padding:5px 12px;
  font-size:11px;font-weight:700;color:var(--gold);
  margin-bottom:10px;
}
.chef-level-bar{flex:1;height:5px;background:#e8d8c0;border-radius:99px;overflow:hidden;}
.chef-level-fill{height:100%;background:linear-gradient(90deg,var(--accent),#f0a030);border-radius:99px;transition:width .6s ease;}

/* ── End screen ── */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px 0;overflow-y:auto;}
.end-em{font-size:68px;line-height:1;}
.end-title{font-size:26px;font-weight:800;color:var(--accent);}
.end-sub{font-size:14px;color:var(--muted);}
.stats{display:flex;gap:12px;}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);}
.stat-n{font-size:24px;font-weight:800;color:var(--accent);}
.stat-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.restart{background:linear-gradient(135deg,var(--accent),#9a4800);color:#fff;border:none;border-radius:14px;padding:14px 34px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 18px rgba(196,106,32,.4);letter-spacing:.3px;-webkit-appearance:none;}
.exit-btn{background:none;border:1.5px solid var(--border);border-radius:12px;padding:9px 28px;font-size:13px;font-weight:700;color:var(--muted);font-family:inherit;cursor:pointer;-webkit-appearance:none;transition:opacity .15s;}
.exit-btn:active{opacity:.6;}
.achievements{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:340px;}
.ach-pill{font-size:11px;padding:4px 10px;border-radius:99px;background:#fff4e0;border:1px solid #f0c070;color:#7a4800;font-weight:600;}

/* ── Ranking ── */
.ranking-section{width:100%;max-width:360px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);}
.ranking-title{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.ranking-title-left{display:flex;align-items:center;gap:6px;}
.ranking-io{display:flex;gap:6px;}
.ranking-io button{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.ranking-io button:hover{border-color:var(--accent);color:var(--accent);}
.ranking-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-size:13px;margin-bottom:3px;}
.ranking-row.current{background:#fff4e0;border:1px solid #f0c070;}
.ranking-row.gold{background:#fffde7;}
.rank-pos{font-size:16px;min-width:24px;text-align:center;}
.rank-name{flex:1;font-weight:700;color:var(--text);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-score{font-weight:800;color:var(--accent);min-width:36px;text-align:right;}
.rank-detail{font-size:10px;color:var(--muted);min-width:60px;text-align:right;}
.save-row{display:flex;gap:8px;margin-top:10px;}
.save-input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;height:40px;font-size:14px;color:var(--text);font-family:inherit;outline:none;background:#fff;}
.save-input:focus{border-color:var(--accent);}
.save-btn{background:linear-gradient(135deg,var(--accent),#9a4800);color:#fff;border:none;border-radius:10px;padding:0 16px;height:40px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap;}
.saved-ok{font-size:12px;color:var(--green);font-weight:700;text-align:center;margin-top:6px;}

/* ── Record banner ── */
.record-banner{width:100%;max-width:360px;border-radius:14px;padding:12px 18px;display:flex;align-items:center;gap:12px;border:2px solid;}
.record-banner.new-record{background:#fffbe6;border-color:#f0c040;}
.record-banner.same-record{background:#f5f5f5;border-color:#ddd;}
.record-banner-icon{font-size:28px;line-height:1;}
.record-banner-body{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;}
.record-banner-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);}
.record-banner-name{font-size:12px;font-weight:600;color:var(--text);}
.record-banner-pts{font-size:26px;font-weight:800;color:var(--accent);margin-left:auto;}

/* ── Splash ── */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:0;padding:16px 10px 24px;overflow-y:auto;}
.splash-chef{font-size:64px;line-height:1;margin-bottom:10px;animation:chefFloat 3s ease-in-out infinite;}
.splash-title{font-size:26px;font-weight:800;color:var(--accent);letter-spacing:-.3px;margin-bottom:3px;}
.splash-sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.splash-record{display:flex;align-items:center;gap:8px;background:#fff8ed;border:1.5px solid #f0c070;border-radius:14px;padding:8px 16px;margin-bottom:12px;}
.splash-record-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);}
.splash-record-name{font-size:12px;font-weight:800;color:var(--text);}
.splash-record-pts{font-size:20px;font-weight:800;color:var(--accent);margin-left:auto;padding-left:12px;}

/* Chef Level splash */
.splash-chef-level{
  width:100%;max-width:320px;
  background:#fff8ed;border:1.5px solid #f0c070;
  border-radius:14px;padding:10px 16px;margin-bottom:14px;
  display:flex;flex-direction:column;gap:6px;
}
.scl-top{display:flex;align-items:center;justify-content:space-between;}
.scl-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);}
.scl-name{font-size:13px;font-weight:800;color:var(--accent);}
.scl-pts{font-size:11px;color:var(--muted);}
.scl-bar{height:6px;background:#e8d8c0;border-radius:99px;overflow:hidden;}
.scl-fill{height:100%;background:linear-gradient(90deg,var(--accent),#f0a030);border-radius:99px;transition:width .6s ease;}

/* Category selector */
.cat-selector{width:100%;max-width:340px;margin-bottom:14px;}
.cat-selector-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;text-align:left;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.cat-toggle{
  display:flex;align-items:center;gap:6px;
  padding:7px 10px;border-radius:10px;border:1.5px solid var(--border);
  background:#fff;cursor:pointer;font-size:11px;font-weight:600;color:var(--text);
  font-family:inherit;transition:all .15s;text-align:left;
}
.cat-toggle.selected{border-color:var(--accent);background:#fff4e0;color:var(--accent);}
.cat-toggle-check{font-size:12px;margin-left:auto;opacity:0;transition:opacity .15s;}
.cat-toggle.selected .cat-toggle-check{opacity:1;}
.cat-count{font-size:9px;color:var(--dim);margin-left:auto;}
.select-all-row{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px;}
.select-all-row button{font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;}
.select-all-row button:hover{border-color:var(--accent);color:var(--accent);}

.play-btn{background:linear-gradient(135deg,var(--accent),#9a4800);color:#fff;border:none;border-radius:16px;padding:15px 44px;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 6px 22px rgba(196,106,32,.45);letter-spacing:.3px;-webkit-appearance:none;transition:transform .1s;}
.play-btn:active{transform:scale(.95);}
.play-btn:disabled{opacity:.45;cursor:default;transform:none;}
.splash-info{font-size:10px;color:var(--dim);margin-top:10px;}

/* ── Animations ── */
@keyframes chefFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes heartBeat{0%,100%{transform:scale(1)}30%{transform:scale(1.4)}60%{transform:scale(.9)}}
@keyframes levelUp{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.shake{animation:shake .45s ease;}
.pop{animation:pop .35s ease;}
.beat{animation:heartBeat .5s ease;}
.level-up{animation:levelUp .5s ease;}
@keyframes hotPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(224,112,32,.35)}50%{transform:scale(1.06);box-shadow:0 0 0 5px rgba(224,112,32,0)}}
.streak-badge.hot{animation:hotPulse 1.3s ease-in-out infinite;}
@keyframes confettiFall{0%{transform:translateY(-40px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(360deg);opacity:.85}}
.confetti{position:fixed;top:-30px;z-index:998;pointer-events:none;animation:confettiFall 3s linear forwards;}
.cat-toggle{flex-direction:column;align-items:stretch;gap:4px;}
.cat-toggle-main{display:flex;align-items:center;gap:6px;width:100%;}
.cat-mini-bar{display:block;height:3px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden;}
.cat-mini-fill{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s;}
.review-box{width:100%;max-width:360px;background:#fff8ed;border:1.5px solid #f0c070;border-radius:14px;padding:10px 12px;}
.review-title{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;text-align:left;}
.review-chips{display:flex;flex-wrap:wrap;gap:5px;}
.review-chip{font-size:11px;padding:5px 9px;border-radius:99px;background:#fff;border:1px solid var(--border);color:var(--text);font-family:inherit;cursor:pointer;-webkit-appearance:none;}
.review-chip strong{color:var(--green);}
.review-chip:active{transform:scale(.95);}
</style>
</head>
<body>
<div id="fs-gate" style="position:fixed;inset:0;z-index:9999;background:transparent;cursor:pointer;"></div>
<div id="shell"></div>
<div id="toast"></div>
<div id="aria-announce" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);"></div>
<script>
/* ── Fullscreen gate ── */
(function(){
  const gate=document.getElementById('fs-gate');
  function enterFS(){
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
    if(req){const p=req.call(el);if(p)p.catch(()=>{});}
    if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(()=>{});
  }
  function handleFirstGesture(e){
    e.preventDefault();e.stopPropagation();
    const touch=e.changedTouches?e.changedTouches[0]:e;
    const x=touch.clientX,y=touch.clientY;
    enterFS();gate.style.display='none';
    setTimeout(()=>{
      const target=document.elementFromPoint(x,y);
      if(target&&target!==gate){
        if(typeof target.focus==='function'&&(target.tagName==='INPUT'||target.isContentEditable))target.focus();
        else target.click();
      }
    },40);
  }
  gate.addEventListener('touchend',handleFirstGesture,{once:true,passive:false});
  gate.addEventListener('click',handleFirstGesture,{once:true});
  document.addEventListener('fullscreenchange',()=>{

let _ac=null;
function getAC(){
  if(!_ac){try{_ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(_ac&&_ac.state==='suspended')_ac.resume();
  return _ac;
}
function beep(freq,dur,type='square',vol=0.18,decay=true){
  const ac=getAC();if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);
  g.gain.setValueAtTime(vol,ac.currentTime);
  if(decay)g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
  o.start(ac.currentTime);o.stop(ac.currentTime+dur);
}

let _esVoice=null;
function pickESVoice(){
  if(!window.speechSynthesis)return;
  const vs=speechSynthesis.getVoices();
  _esVoice=vs.find(v=>/^es[-_]AR/i.test(v.lang))
    ||vs.find(v=>/^es[-_]419/i.test(v.lang))
    ||vs.find(v=>/^es[-_](UY|CL|MX)/i.test(v.lang))
    ||vs.find(v=>/^es/i.test(v.lang))||null;
}
if(window.speechSynthesis){
  pickESVoice();
  speechSynthesis.onvoiceschanged=pickESVoice;
}
function speakES(text,force){
  if((!voiceOn&&!force)||!window.speechSynthesis||!text)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(!_esVoice)pickESVoice();
    if(_esVoice)u.voice=_esVoice;
    u.lang=_esVoice?_esVoice.lang:'es-AR';
    u.rate=0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

function getChefLevel(consolidated){
  for(let i=CHEF_LEVELS.length-1;i>=0;i--){
    if(consolidated>=CHEF_LEVELS[i].min)return{...CHEF_LEVELS[i],idx:i};
  }
  return{...CHEF_LEVELS[0],idx:0};
}
function chefLevelProgress(consolidated){
  const lv=getChefLevel(consolidated);
  if(lv.max===Infinity)return 1;
  return Math.min((consolidated-lv.min)/(lv.max-lv.min),1);
}

// SRS: record a correct answer (consolidate word if correct 3+ times total)
function srsCorrect(pt){
  const db=loadSRS();
  if(!db[pt])db[pt]={correct:0,errors:0,lastSeen:Date.now(),interval:1};
  db[pt].correct++;
  db[pt].lastSeen=Date.now();
  // Interval doubles each correct
  db[pt].interval=Math.min(db[pt].interval*2,64);
  saveSRS(db);
  // Consolidate into chef level
  if(db[pt].correct===3){
    const chef=loadChef();
    chef.consolidated=(chef.consolidated||0)+1;
    saveChef(chef);
    return true; // newly consolidated
  }
  return false;
}
function srsError(pt){
  const db=loadSRS();
  if(!db[pt])db[pt]={correct:0,errors:0,lastSeen:Date.now(),interval:1};
  db[pt].errors++;
  db[pt].lastSeen=Date.now();
  db[pt].interval=1; // reset interval on error
  saveSRS(db);
}
function srsErrorCount(pt){
  const db=loadSRS();
  return db[pt]?db[pt].errors:0;
}
// Returns items sorted by SRS priority (most overdue & most errors first)
function srsPrioritize(items){
  const db=loadSRS();
  const now=Date.now();
  return [...items].sort((a,b)=>{
    const da=db[a.pt]||{errors:0,interval:1,lastSeen:0};
    const db2=db[b.pt]||{errors:0,interval:1,lastSeen:0};
    // Score: errors weighted + time overdue
    const scoreA=da.errors*3+Math.max(0,(now-da.lastSeen)/(da.interval*24*3600*1000)-1)*10;
    const scoreB=db2.errors*3+Math.max(0,(now-db2.lastSeen)/(db2.interval*24*3600*1000)-1)*10;
    return scoreB-scoreA;
  });
}

  URL.revokeObjectURL(url);
}
function importRanking(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.ranking)saveRanking(data.ranking);
        if(data.chef)saveChef(data.chef);
        if(data.srs)saveSRS(data.srs);
        toast('Dados importados! ✓','#2a6e2a');
        setTimeout(()=>start(),800);
      }catch(err){toast('Arquivo inválido ✕','#b82020');}
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ── Helpers ── */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[¿¡?!.,;:]/g,"").replace(/\s+/g," ").trim();
function prefixChar(item){
  const es=item.es;
  if(es.every(a=>a.startsWith('¿')))return'¿';
  if(es.every(a=>a.startsWith('¡')))return'¡';
  return'';
}
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
function diffPips(dif){
  return Array.from({length:3},(_,i)=>`<span style="${i<dif?'':'opacity:.22;filter:grayscale(1);'}">🌶</span>`).join('');
}
function getExample(item){
  if(item.example)return item.example;
  if(EXAMPLES[item.pt])return EXAMPLES[item.pt];
  return null;
}

function toggleAllCats(val){
  document.querySelectorAll('.cat-toggle').forEach(btn=>{
    const cat=btn.dataset.cat;const col=CC[cat];
    if(val){
      btn.classList.add('selected');
      btn.style.borderColor=col.b;btn.style.background=col.bg;btn.style.color=col.c;
    } else {
      btn.classList.remove('selected');
      btn.style.borderColor='';btn.style.background='';btn.style.color='';
    }
  });
  updateSplashInfo();
}

function getSelectedCats(){
  return [...document.querySelectorAll('.cat-toggle.selected')].map(b=>b.dataset.cat);
}

function updateSplashInfo(){
  const sel=getSelectedCats();
  const count=ITEMS.filter(it=>sel.includes(it.cat)).length;
  const info=document.getElementById('splash-info');
  const btn=document.getElementById('play-btn');
  if(info)info.textContent=`${count} palavras selecionadas · 5 vidas · sequências recuperam vidas`;
  if(btn)btn.disabled=count===0;
}

function beginGame(){
  selectedCats=getSelectedCats();
  try{localStorage.setItem('cocina_cats',JSON.stringify(selectedCats));}catch(e){}
  const pool=ITEMS.filter(it=>selectedCats.includes(it.cat));
  if(!pool.length)return;
  // SRS-prioritized shuffle: top 30% by priority, rest random
  const prioritized=srsPrioritize(pool);
  const splitAt=Math.ceil(prioritized.length*0.3);
  const front=shuffle(prioritized.slice(0,splitAt));
  const rest=shuffle(prioritized.slice(splitAt));
  deck=[...front,...rest];
  origLen=deck.length;
  idx=0;lives=MAX_LIVES;score=0;streak=0;bestStreak=0;totalErrors=0;
  fb=null;wrongIn='';gameOver=false;gameWon=false;
  sessionErrors={};sessionConsolidated=0;
  render();
}

function start(){renderSplash();}

function saveScore(){
  const inp=document.getElementById('rank-name');
  if(!inp||!inp.value.trim())return;
  const name=inp.value.trim();
  _justSaved=true;_savedName=name;
  addToRanking(name,score,bestStreak);
  renderEnd();
}

/* ── Achievements ── */
function calcAchievements(){
  const achs=[];
  if(bestStreak>=10)achs.push('🔥 Racha de 10+');
  if(bestStreak>=5)achs.push('⚡ Racha de 5+');
  if(totalErrors===0)achs.push('🏅 Sem erros!');
  if(totalErrors<=3)achs.push('✨ Quase perfeito');
  if(sessionConsolidated>=5)achs.push('📚 5 novas consolidadas');
  if(sessionConsolidated>=10)achs.push('🎓 10 novas consolidadas');
  const sdb=loadSRS();
  const catsDone={};
  selectedCats&&selectedCats.forEach(c=>{
    const items=ITEMS.filter(it=>it.cat===c);
    const allOk=items.every(it=>sdb[it.pt]&&sdb[it.pt].correct>=3);
    if(allOk)catsDone[c]=true;
  });
  Object.keys(catsDone).forEach(c=>achs.push(`🗂 ${c} dominada!`));
  return achs;
}

/* ── Palavras erradas da sessão (para revisar) ── */
function reviewHTML(){
  const keys=Object.keys(sessionErrors||{});
  if(!keys.length)return'';
  const rows=keys
    .sort((a,b)=>sessionErrors[b]-sessionErrors[a])
    .slice(0,8)
    .map(pt=>{
      const it=ITEMS.find(x=>x.pt===pt);
      if(!it)return'';
      return `<button class="review-chip" onclick="speakES('${it.es[0].replace(/'/g,"\\'")}',true)">
        ${pt} → <strong>${it.es[0]}</strong> 🔊</button>`;
    }).join('');
  return `<div class="review-box">
    <div class="review-title">📖 Para revisar (toque para ouvir)</div>
    <div class="review-chips">${rows}</div>
  </div>`;
}

      <div class="stats">

      ${!gameWon?`<button class="exit-btn" onclick="window.close()">Sair ✕</button>`:''}
    </div>`;

  const ni=document.getElementById('rank-name');
  if(ni)ni.addEventListener('keydown',e=>{if(e.key==='Enter')saveScore();});

  if(gameWon&&!sh._confettiDone){
    sh._confettiDone=true;

      setTimeout(()=>sp.remove(),4500);
    }
  }
}

/* ── Render ── */
function render(){
  const sh=document.getElementById('shell');

  if(gameOver||gameWon){_justSaved=false;_savedName='';renderEnd();return;}

  const total=deck.length;
  const pct=Math.min(Math.round(idx/origLen*100),100);
  const retryCount=deck.slice(idx).filter(c=>c.retry||c.immediateRetry).length;
  const retryPct=Math.min(Math.round(retryCount/origLen*100),100);

  const heartHTML=Array.from({length:MAX_LIVES},(_,i)=>{
    const lost=i>=lives;
    return`<span class="heart${lost?' lost':''}">${lost?'🤍':'❤️'}</span>`;
  }).join('');

  const streakN=streak>=3?`🔥 ${streak}`:streak>0?`✨ ${streak}`:`✨ 0`;
  const streakHot=streak>=3?' hot':'';
  const cur=deck[idx];
  const col=CC[cur.cat]||CC['ingrediente'];
  const icon=CAT_ICON[cur.cat]||'🍽';

  let fbHTML='';
  // Show example after 2nd error on same card (uses sessionErrors keyed by pt)
  const errThisCard=sessionErrors[cur.pt]||0;
  const exampleToShow=(fb==='err'&&errThisCard>=2)?getExample(cur):null;

  if(fb==='ok'){
    const alts=cur.es.length>1?`<span class="fb-also">(tb: ${cur.es.slice(1,3).join(', ')})</span>`:'';
    fbHTML=`<span class="fb-ok">✓ ${cur.es[0]}</span><button class="speak-btn" onclick="event.stopPropagation();speakCur()" aria-label="Ouvir pronúncia">🔊</button>${alts}`;
    announce(`Correto! ${cur.es[0]}`);
  } else if(fb==='err'){
    fbHTML=`<span class="fb-wrong">${wrongIn}</span><span class="fb-arrow">→</span><span class="fb-correct-word">${cur.es[0]}</span><button class="speak-btn" onclick="event.stopPropagation();speakCur()" aria-label="Ouvir pronúncia">🔊</button>`;
    if(exampleToShow)fbHTML+=`<div class="example-line">Ex: ${exampleToShow}</div>`;
    announce(`Errado. A resposta é ${cur.es[0]}.${exampleToShow?' Exemplo mostrado.':''}`);
  }

  const cardCls=`word-card${fb==='ok'?' ok':fb==='err'?' err':''}${cur.retry?' retry-card':''}`;
  const inpCls=fb==='ok'?'ok':fb==='err'?'err':'';
  const retryPill=cur.immediateRetry
    ?`<span class="retry-pill" style="background:#fff0e0;border-color:#f0a030;color:#8b4800;">⚡ tente de novo</span>`
    :cur.retry?`<span class="retry-pill">↩ revisar</span>`:'';
  const pfx=prefixChar(cur);
  const prefixHint=pfx?`<span class="prefix-hint">${pfx}…${pfx==='¿'?'?':'!'}</span>`:'';
  const dif=cur.dif||1;
  const difHTML=`<span class="diff-pip" title="Dificuldade ${dif}/3">${diffPips(dif)}</span>`;

  const retryInfo=`<div class="retry-count">${Math.min(idx,origLen)}/${origLen}${retryCount>0?` · ↩ ${retryCount} carta${retryCount>1?'s':''} em revisão`:''}</div>`;

  sh.innerHTML=`
    <header>
      <div class="logo"><span class="logo-icon">👨‍🍳</span><span class="logo-name">La Cocina Porteña</span></div>
      <div class="hud">
        <button class="voice-toggle" id="voice-btn" onclick="toggleVoice()" aria-label="Ativar ou desativar pronúncia">${voiceOn?'🔊':'🔇'}</button>
        <div class="streak-badge${streakHot}">${streakN}</div>
        <div class="score-badge">${score}</div>
      </div>
    </header>
    <div class="prog-wrap">
      <div class="prog-wrap-inner">
        <div class="prog-fill" style="width:${pct}%"></div>
        <div class="prog-retry" style="width:${retryPct}%"></div>
      </div>
    </div>
    ${retryInfo}
    <div class="lives-bar" role="img" aria-label="${lives} de ${MAX_LIVES} vidas">${heartHTML}</div>
    <div class="spacer"></div>
    <div class="${cardCls}" id="wc" role="region" aria-label="Carta ${idx+1} de ${total}"${fb!==null?' onclick="skipWait()" style="cursor:pointer;"':''}>
      <div style="display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:10px;">
        <span class="cat-badge" style="background:${col.bg};color:${col.c};border-color:${col.b};">${icon} ${cur.cat}</span>
        ${difHTML}${retryPill}${prefixHint}
      </div>
      <div class="pt-word" lang="pt">${cur.pt}</div>
      <div class="feedback-line" aria-live="polite">${fbHTML}</div>
    </div>
    <div style="height:10px;flex-shrink:0;"></div>
    <div class="input-wrap">
      <div id="ans" class="ans-div ${inpCls}"
        ${fb!==null?'contenteditable="false"':'contenteditable="true"'}
        data-placeholder="en castellano…"
        spellcheck="false" autocorrect="off" autocapitalize="off"
        role="textbox" aria-label="Resposta em espanhol" lang="es"></div>
      <button class="btn" onclick="submit()" ${fb!==null?'disabled':''} aria-label="Confirmar resposta">OK</button>
    </div>
    <div class="hint-text">${fb===null?`Carta ${idx+1} de ${total}${total>origLen?' (com revisões)':''}`:''}</div>
    <div class="enter-hint">${fb===null?'Enter ou toque em OK':'Enter ou toque na carta para continuar'}</div>
    <div class="counter"></div>`;

  const inp=document.getElementById('ans');
  if(inp&&fb===null){
    setTimeout(()=>{
      const pre=prefixChar(cur);
      if(pre&&inp.textContent.trim()==='')inp.textContent=pre;
      inp.focus();
      const range=document.createRange(),sel=window.getSelection();
      range.selectNodeContents(inp);range.collapse(false);
      sel.removeAllRanges();sel.addRange(range);
    },60);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
    inp.addEventListener('paste',e=>{
      e.preventDefault();
      const text=(e.clipboardData||window.clipboardData).getData('text/plain');
      document.execCommand('insertText',false,text);
    });
  }
}

/* ── Submit ── */
function submit(){
  if(fb!==null)return;
  const inp=document.getElementById('ans');
  if(!inp)return;
  const val=(inp.innerText||inp.textContent||'').trim();
  if(!val)return;
  const cur=deck[idx];
  const ok=cur.es.some(a=>norm(a)===norm(val));

  if(ok){
    score++;streak++;
    if(streak>bestStreak)bestStreak=streak;
    fb='ok';
    if(streak===3||streak===5||streak%10===0)soundStreak();else soundOk();
    fbAt=Date.now();
    setTimeout(()=>speakES(cur.es[0]),250);

    // SRS: register correct
    const newlyConsolidated=srsCorrect(cur.pt);
    if(newlyConsolidated){
      sessionConsolidated++;
      const chef=loadChef();
      const prevLv=getChefLevel((chef.consolidated||1)-1);
      const newLv=getChefLevel(chef.consolidated||0);
      if(newLv.idx>prevLv.idx){
        soundLevelUp();
        toast(`${newLv.icon} Novo nível: ${newLv.name}!`,'#7b1fa2');
      }
    }

    // Recover life every 5 consecutive
    if(streak%5===0&&lives<MAX_LIVES){
      lives++;
      setTimeout(()=>{
        const hearts=document.querySelectorAll('.heart');
        const newHeart=hearts[lives-1];
        if(newHeart){newHeart.classList.add('beat');setTimeout(()=>newHeart.classList.remove('beat'),600);}
      },80);
      soundLife();toast(`¡Vida recuperada! ❤️ (${streak} seguidas)`);
    } else if(streak===3){
      toast('🔥 Racha de 3! Seguí así…','#c96a20');
    } else if(streak===5){
      toast('⚡ ¡5 seguidas! ¡Capa total!','#7b1fa2');
    }
    render();
    const wc=document.getElementById('wc');
    if(wc){wc.classList.remove('pop');void wc.offsetWidth;wc.classList.add('pop');}
    advTimer=setTimeout(advance,1400);
  } else {
    lives--;streak=0;totalErrors++;wrongIn=val;fb='err';
    sessionErrors[cur.pt]=(sessionErrors[cur.pt]||0)+1;
    soundErr();
    srsError(cur.pt);
    fbAt=Date.now();
    setTimeout(()=>speakES(cur.es[0]),400);

    deck.splice(idx+1,0,{...cur,immediateRetry:true});
    if(!cur.immediateRetry){
      const insertAt=Math.min(idx+2+Math.floor(Math.random()*5),deck.length);
      deck.splice(insertAt,0,{...cur,retry:true});
    }
    render();
    const wc=document.getElementById('wc');
    if(wc){wc.classList.remove('shake');void wc.offsetWidth;wc.classList.add('shake');}
    if(lives<=0){soundGameOver();advTimer=setTimeout(()=>{gameOver=true;render();},2800);}
    else advTimer=setTimeout(advance,2800);
  }
}

/* ── Skip wait (Enter ou toque avançam antes do tempo) ── */
function skipWait(){
  if(fb===null||gameOver||gameWon)return;
  if(Date.now()-fbAt<400)return;
  clearTimeout(advTimer);
  if(lives<=0){gameOver=true;render();}
  else advance();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&fb!==null)skipWait();
});

/* ── Advance ── */
function advance(){
  const next=idx+1;
  const inp=document.getElementById('ans');
  if(inp){inp.textContent='';inp.classList.remove('ok','err');}
  if(next>=deck.length){soundGameWin();gameWon=true;render();}
  else{idx=next;fb=null;wrongIn='';render();}
}

/* ── Keyboard resize ── */
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    const sh=document.getElementById('shell');
    if(sh)sh.style.height=window.visualViewport.height+'px';
  });
  document.getElementById('shell').style.height=window.visualViewport.height+'px';
}

start();
</script>
</body>
</html>
